# cargo-deny: licenses, vulnerabilities, banned crates and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates pulled in by Slint and zbus (its Linux D-Bus stack), with no direct
# replacement. Review them when Slint is upgraded (M0 report).
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils (via Slint/zbus) is unmaintained" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (via Slint) is unmaintained" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (via zbus) is unmaintained" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant (via zbus) is unmaintained" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (via zbus) is unmaintained" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Only licenses compatible with GPLv3 (Clocky's license).
allow = [
    "MIT",
    "MIT-0",
    # interprocess (recvmsg, doctest-file) and ksni (Slint's Linux tray).
    "0BSD",
    "Unlicense",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The core must not depend on a UI or OS integrations (spec, section 10.3).
deny = [
    { crate = "slint", wrappers = ["clocky-app"] },
    { crate = "tray-icon", wrappers = ["clocky-app"] },
    { crate = "notify-rust", wrappers = ["clocky-app"] },
    { crate = "rodio", wrappers = ["clocky-app"] },
    { crate = "auto-launch", wrappers = ["clocky-app"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
