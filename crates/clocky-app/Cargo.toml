[package]
name = "clocky-app"
description = "Clocky desktop app: UI (Slint) and system integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "clocky"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Local wall-clock times (session rows, "termina às HH:MM"): `clock` gives `chrono::Local`;
# it only converts timestamps, the app never reads the clock through it.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clocky-core.workspace = true
directories = "6.0.0"
# PNG encoder for the screenshot hook; already in the Slint dependency graph.
image = { version = "0.25.10", default-features = false, features = ["png"] }
interprocess = "2.4.7"
notify-rust = "4.18.2"
rodio = "0.23.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
# Registers the AppUserModelId so notifications show "Clocky" as the sender.
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"

# A copy of `[workspace.lints]` with one change: `unsafe_code` is `deny` instead of `forbid`.
# The code generated by `slint::include_modules!` carries `#[allow(unsafe_code)]`, which a
# `forbid` cannot be overridden by (error E0453). The crate itself still has no `unsafe`.
# Keep this list in sync with the workspace one (clocky-core keeps `forbid`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
