name: Release

# Runs after CI passes on a push to main (dev -> main merge).
# The version comes from the commits: feat -> 0.x.0, breaking change -> x.0.0, fix/perf -> 0.0.x.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  version:
    name: Compute version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: next
        run: |
          next="$(bash scripts/next-version.sh)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next:-none (no feat/fix/perf/breaking change)}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.next != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig1-dev
      - name: Set version
        shell: bash
        run: bash scripts/set-version.sh "${{ needs.version.outputs.next }}"
      - run: cargo build --release --locked -p clocky-app
      - name: Package
        shell: bash
        run: |
          name="clocky-${{ needs.version.outputs.next }}-${{ matrix.target }}"
          # The embedded fonts (OFL-1.1) and icons (Feather MIT notice) ship their notices.
          mkdir -p dist stage/licenses
          cp LICENSE README.md stage/
          cp crates/clocky-app/fonts/OFL.txt stage/licenses/fonts-OFL.txt
          cp crates/clocky-app/icons/LICENSE.md stage/licenses/icons-LICENSE.md
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/clocky.exe stage/
            (cd stage && 7z a "../dist/${name}.zip" .)
          else
            cp target/release/clocky stage/
            tar -czf "dist/${name}.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: git cliff --unreleased --tag "${{ needs.version.outputs.next }}" --strip all > notes.md
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.next }}" dist/* \
            --target "$SHA" \
            --title "Clocky ${{ needs.version.outputs.next }}" \
            --notes-file notes.md
